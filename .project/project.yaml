# Durable project intent — conforms to dev-lifecycle v4
# schemas/project-config.schema.json.
#
# This file records DECISIONS, not observations. Capability verdicts live in
# .project/inventory.json; everything else is asked of a live source at the
# time of asking. Nothing here is a cache.
#
# Migrated from the v3 Product Graph on 2026-08-22, when dev-lifecycle v4
# deleted it. The 14 capability verdicts came across via
# `devctl inventory --migrate`.

name: signalhire-mcp
profile: integration-project
confirmed_by_user: true

github:
  repo: vanman2024/signalhire-mcp
  default_branch: main

# Names only. Staging does not exist yet; that gap is tracked as work, not as
# a redefinition of the contract.
environments:
  - development
  - staging
  - production

deployment:
  provider: fastmcp-cloud
  platform: prefect-horizon
  scope: all self-built MCP servers
  staging_strategy: horizon branch previews

decisions:
  - decision: >
      Profile is integration-project (Integration / MCP Server).
    why: >
      Matches every detection signal: an MCP manifest (fastmcp.json), provider
      adapters (src/signalhire_mcp/delivery/), and a webhook handler
      (src/signalhire_mcp/routes.py). Headless — no human surface, which is why
      S01 is not_applicable rather than missing.

  - decision: >
      FastMCP Cloud (Prefect Horizon) is the deployment target, for this and
      every self-built MCP server.
    why: >
      Removes hand-operated hosts and brings CI/CD, branch previews, rollbacks
      and OAuth. Decided by the user 2026-08-17.
    supersedes: scripts/deploy-to-droplet.sh and install.sh
    open_risk: >
      Horizon is managed, autoscaled and redeploys on every push to main, and
      documents neither a persistent volume nor that it routes any path other
      than /mcp. The file-backed inbox required both. Resolved by ADR-0001,
      which moves the receive path out entirely.

  - decision: >
      MCP is a surface, not the plumbing. Inbound vendor webhooks and
      app-facing calls are ordinary HTTP that belongs below both front doors.
      The ownership half — who holds the durable callback inbox — was decided
      for StaffHive on 2026-08-17 and REOPENED on 2026-08-22. Nothing retired.
    why: >
      Recorded in docs/adr/0001-mcp-surface-vs-integration-plumbing.md. The
      rule stands. The ownership choice assumed this repo is a StaffHive
      component; it is not — SignalHire is one integration among many, reached
      by API key under an organizational hierarchy that owns the list.
    supersedes: >
      The single-process collapse in 531e06c, which was correct for a droplet
      and wrong for FastMCP Cloud.
    open_risk: >
      Blocked on the organizational hierarchy — the level above TenantRegistry
      that owns a list of integrations. Until that exists, the two FastMCP
      Cloud blockers stand: no documented persistent volume, and no documented
      non-/mcp ingress. See signalhire-mcp#4.
