[project]
name = "signalhire-mcp-server"
version = "2.0.0"
description = "FastMCP server for SignalHire — contact enrichment with a durable callback inbox and pluggable delivery adapters"
readme = "README.md"
requires-python = ">=3.10"
# Every dependency is pinned exactly.
#
# fastmcp 4 is a prerelease, so resolution must allow prereleases (see
# [tool.uv] below). That permission is global in uv, which means a loose
# specifier anywhere lets *that* package resolve to a prerelease too — an
# unpinned `pydantic` resolves to 2.14.0b1. Exact pins are what keeps the
# prerelease surface to fastmcp alone.
#
# FastMCP 4 uses httpx2, not httpx. Do not add httpx back: FastMCP raises
# httpx2 exceptions, so `except httpx.ConnectError` around a FastMCP call is
# dead code that silently stops catching anything.
dependencies = [
    "fastmcp==4.0.0b2",
    "httpx2==2.10.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.2",
]

[tool.uv]
# Required for fastmcp==4.0.0b2. Scoped by the exact pins above.
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalhire_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Both roots are declared so first-party detection does not depend on what
# happens to be installed. Without this, ruff inferred `signalhire_mcp` as
# first-party locally (src/ layout on disk) and third-party in CI (resolved
# from the synced venv), so `ruff check` passed here and failed there on the
# same commit. Import classification must not vary by environment.
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["signalhire_mcp", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
